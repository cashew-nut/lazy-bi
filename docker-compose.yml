# Three ways to run:
#   docker compose up                      -> demo mode (embedded S3 emulator) on :8080
#   CI_BUCKET=my-bucket docker compose up  -> the same, plus your real bucket:
#                                             the demo catalog keeps its own
#                                             in-container emulator, your data
#                                             comes from AWS. Credentials below.
#   docker compose --profile minio up      -> also starts MinIO + a second app
#                                             on :8081 backed by it
# First start prints the bootstrap admin's one-time password in the compose
# output — accounts live in the app-data volume, so it never reprints.
# Behind a TLS proxy, pass CI_COOKIE_SECURE=1 (and optionally
# CI_SESSION_IDLE_DAYS / CI_SESSION_MAX_DAYS) via `environment:`.
# Conversational analytics (specs/012-conversational-analytics/) is off
# unless CI_LLM_API_KEY is set. Any OpenAI- or Anthropic-compatible endpoint
# works — set CI_LLM_BASE_URL and CI_LLM_MODEL to match your provider, and
# leave the URL unset for Anthropic's own API. Export them in your shell, or
# put them in a .env file next to this compose file (copy .env.example), and
# they're picked up below — no compose edits needed. See the README's
# "Conversational analytics" section for the full provider list and for
# exactly what this sends to whichever one you configure.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      CI_S3_ENDPOINT: ${CI_S3_ENDPOINT:-}
      # Object store. Leave every one of these unset for the fully-local demo.
      # For a real bucket, CI_BUCKET is the only required setting: leave
      # CI_S3_ENDPOINT unset and AWS is addressed by region, the way it wants
      # to be. Set CI_S3_ENDPOINT only for MinIO/LocalStack/an S3-compatible
      # vendor. The demo bucket keeps its own in-container emulator either
      # way, so the built-in catalog goes on working next to your data —
      # CI_DEMO=0 turns it off entirely.
      #
      # Credentials: AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, or AWS_PROFILE
      # against the ~/.aws mounted read-only below (SSO included — the
      # container reads the same cached token the CLI refreshes on the host),
      # or neither, and boto3's own chain finds the instance/task role. Each
      # is passed through as `${VAR:-}`, which is empty when you haven't set
      # it — app/config.py reads empty as unset for exactly this reason.
      CI_BUCKET: ${CI_BUCKET:-}
      CI_BUCKET_PREFIX: ${CI_BUCKET_PREFIX:-}
      CI_DEMO: ${CI_DEMO:-}
      CI_LIST_MAX_KEYS: ${CI_LIST_MAX_KEYS:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      # A container gets the *host's* core count and RAM from DuckDB unless
      # told otherwise, which is how a memory limit set on the container turns
      # into an OOM kill instead of a spill to disk.
      CI_DUCKDB_THREADS: ${CI_DUCKDB_THREADS:-}
      CI_DUCKDB_MEMORY_LIMIT: ${CI_DUCKDB_MEMORY_LIMIT:-}
      CI_LLM_API_KEY: ${CI_LLM_API_KEY:-}
      CI_LLM_MODEL: ${CI_LLM_MODEL:-claude-sonnet-5}
      CI_LLM_BASE_URL: ${CI_LLM_BASE_URL:-}
      CI_LLM_PROVIDER: ${CI_LLM_PROVIDER:-auto}
      CI_LLM_MODEL_CHOICES: ${CI_LLM_MODEL_CHOICES:-}
      CI_LLM_THINKING_MODELS: ${CI_LLM_THINKING_MODELS:-}
      CI_LLM_THINKING_DEFAULT: ${CI_LLM_THINKING_DEFAULT:-}
      # thinking is charged to the same ceiling as the answer on every
      # provider, so this is the headroom added on top of each feature's own
      # limit — and the measure writer, which writes the longest answers and
      # thinks the longest first, has its own
      CI_LLM_REASONING_TOKENS: ${CI_LLM_REASONING_TOKENS:-}
      CI_MEASURE_WRITER_MAX_TOKENS: ${CI_MEASURE_WRITER_MAX_TOKENS:-}
      CI_MEASURE_WRITER_ATTEMPTS: ${CI_MEASURE_WRITER_ATTEMPTS:-}
      CI_LLM_API_VERSION: ${CI_LLM_API_VERSION:-}
      CI_LLM_AWS_REGION: ${CI_LLM_AWS_REGION:-}
    volumes:
      # So AWS_PROFILE (SSO included) resolves against the host's own config
      # and its cached token, read-only. Docker creates ~/.aws empty on a host
      # that hasn't got one, which is harmless — the other credential paths
      # (static keys, instance role) don't read it at all.
      - ~/.aws:/root/.aws:ro
      - app-data:/data              # sqlite: visuals, dashboards, users, sessions
      - ./models:/srv/models        # edit semantic models from the host, live
      - ./dimensions:/srv/dimensions  # shared dimension bundles, editable live too
      - ./pipelines:/srv/pipelines  # pipeline definitions, editable live too
      - ./data_cache:/srv/data_cache:ro  # optional big datasets (app/load_taxi.py)

  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cashintel
      MINIO_ROOT_PASSWORD: cashintel-secret
    ports:
      - "9000:9000"
      - "9001:9001"                 # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-minio:
    profiles: ["minio"]
    build: .
    ports:
      - "8081:8080"
    environment:
      CI_S3_ENDPOINT: http://minio:9000   # every bucket, demo included, lives here
      AWS_ACCESS_KEY_ID: cashintel
      AWS_SECRET_ACCESS_KEY: cashintel-secret
      CI_DUCKDB_THREADS: ${CI_DUCKDB_THREADS:-}
      CI_DUCKDB_MEMORY_LIMIT: ${CI_DUCKDB_MEMORY_LIMIT:-}
      CI_LLM_API_KEY: ${CI_LLM_API_KEY:-}
      CI_LLM_MODEL: ${CI_LLM_MODEL:-claude-sonnet-5}
      CI_LLM_BASE_URL: ${CI_LLM_BASE_URL:-}
      CI_LLM_PROVIDER: ${CI_LLM_PROVIDER:-auto}
      CI_LLM_MODEL_CHOICES: ${CI_LLM_MODEL_CHOICES:-}
      CI_LLM_THINKING_MODELS: ${CI_LLM_THINKING_MODELS:-}
      CI_LLM_THINKING_DEFAULT: ${CI_LLM_THINKING_DEFAULT:-}
      # thinking is charged to the same ceiling as the answer on every
      # provider, so this is the headroom added on top of each feature's own
      # limit — and the measure writer, which writes the longest answers and
      # thinks the longest first, has its own
      CI_LLM_REASONING_TOKENS: ${CI_LLM_REASONING_TOKENS:-}
      CI_MEASURE_WRITER_MAX_TOKENS: ${CI_MEASURE_WRITER_MAX_TOKENS:-}
      CI_MEASURE_WRITER_ATTEMPTS: ${CI_MEASURE_WRITER_ATTEMPTS:-}
      CI_LLM_API_VERSION: ${CI_LLM_API_VERSION:-}
      CI_LLM_AWS_REGION: ${CI_LLM_AWS_REGION:-}
    volumes:
      - app-data:/data
      - ./models:/srv/models
      - ./dimensions:/srv/dimensions
      - ./pipelines:/srv/pipelines
      - ./data_cache:/srv/data_cache:ro
    depends_on:
      minio:
        condition: service_healthy

volumes:
  app-data:
  minio-data:
