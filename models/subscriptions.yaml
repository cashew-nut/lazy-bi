# Semantic model: subscriptions — demonstrates both ways to do point-in-time
# reporting over rows that have a start and an end.
#
# 1. SPINE — `active_at` is not a real column: it is a timeline the engine
#    generates at the requested grain and interval-joins against
#    [start_date, end_date], so a subscription counts in every period it was
#    active for (null end_date = still active). Nothing to model or maintain,
#    and the timeline is built to fit the query. Filters on active_at
#    (>=, <=, =) bound it; it carries no attributes beyond the date itself.
#
# 2. INTERVAL IMPORT — the `calendar` bundle below is a real, standalone date
#    table with no key relating it to this model. `how: between` joins it on
#    the same interval, so every one of its columns (quarter, month-end flag,
#    day of week...) becomes an ordinary dimension. Use this when the periods
#    need attributes, when several models must share one definition of a
#    period, or when the reporting window should be the calendar's rather than
#    whatever range the data happens to cover.
#
# The two agree. The calendar stores days, but the engine narrows it to one row
# per period at whatever grain the query asks for, so a subscription is counted
# once per period either way: `active_at` at grain 1mo and calendar_date at
# grain 1mo return the same active_customers *and* the same mrr, and so do 1w,
# 1q and 1y. calendar_quarter and calendar_year need no grain picker at all —
# they declare their own in the bundle. The only difference left is reach: the
# spine's timeline runs to today, the calendar's to whatever the table holds.
#
# Both count a subscription in every period its [start, end] interval OVERLAPS
# — one that ran Feb 2nd to Feb 15th is in February, in Q1 and in the year. Set
# `match: period_start` or `period_end` on either for a point-in-time snapshot
# instead (what was open on the 1st / on the last day), which excludes a
# subscription that opened and closed inside the period.
#
# The import is only applied to queries that actually use one of its
# dimensions, so nothing here changes signups or any other by-cohort query.
name: subscriptions
label: Subscriptions
description: Customer subscription intervals — point-in-time actives via a generated spine or an interval-joined calendar.
source:
  format: parquet
  path: s3://cash-intel/subscriptions/*.parquet

dimension_imports:
  - bundle: calendar
    anchor_dataset: days
    how: between
    left_on: [start_date, end_date]
    right_on: date

dimensions:
  - name: active_at
    label: Active At
    type: time
    spine:
      start: start_date
      end: end_date
  - name: start_month
    column: start_date
    label: Signup Date
    type: time
  - name: churn_month
    column: end_date
    label: Churn Month
    type: time
    description: Month a subscription ended. Only meaningful for churned customers.
  - name: plan
    label: Plan
  - name: region
    label: Region

measures:
  - name: active_customers
    label: Active Customers
    description: Distinct customers active at each timeline point.
    expr: count_distinct(customer_id)
  - name: mrr
    label: MRR
    format: currency
    description: Monthly recurring revenue of active subscriptions.
    expr: sum(monthly_fee)
  - name: arpu
    label: ARPU
    format: currency
    expr: sum(monthly_fee) / count_distinct(customer_id)
  - name: signups
    label: Signups
    description: Use with Signup Date (not the spine) for cohort counts.
    expr: count()
  # A measure over an intermediary frame: `end_date - start_date` is date
  # arithmetic, outside the safe measure DSL (plain `expr:` only compiles
  # allowlisted column/aggregate calls), so tenure has to be derived in a
  # `frame` step instead. `dims` carries whatever the query groups by (plan,
  # region, ...) through the step; `churn_month` in frame_emits means the
  # frame's own computed churn date buckets a timeline, not the raw rows.
  - name: median_tenure_days
    label: Median Tenure (Days)
    description: >
      Median subscription length in days among ended subscriptions,
      bucketed by the month each one churned.
    frame: |
      keys = list(dict.fromkeys(["churn_month", *dims]))
      frame = lf.filter(pl.col("end_date").is_not_null()).with_columns(
          (pl.col("end_date") - pl.col("start_date")).dt.total_days().alias("tenure_days"),
          pl.col("end_date").dt.truncate("1mo").alias("churn_month"),
      ).group_by(keys).agg(pl.col("tenure_days").median())
    frame_emits: [churn_month]
    expr: pl.col("tenure_days").median()
