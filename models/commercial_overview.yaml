# Multi-fact model: three fact tables that have nothing to do with each other,
# read on one axis.
#
# Marketing spend, sales revenue and active subscriptions live in separate
# files with no key between them. Plotting all three on one timeline is the
# thing a single-source model cannot do — and joining the three together would
# be worse than not doing it at all, since every order would be paired with
# every spend row for its month and both measures would balloon.
#
# So this model doesn't join them. It lists them as `facts:`, and the engine
# answers a query by running it separately against each fact at the requested
# grain and merging the per-fact *results* on the dimensions they share. Each
# measure keeps the grain of its own table.
#
# That list is the whole file. There is nothing here about how the three agree
# on a date, because agreeing on a date is not this model's business: each fact
# imports the `calendar` bundle, so each already calls the axis
# `calendar_date`. Note how differently they reach it, and how little that
# matters from here:
#
#   sales        on: order_date   — an event date, one row per order
#   marketing    on: month        — already monthly, lands on each month start
#   subs         how: between     — an interval join, so a subscription counts
#                                   in every period it was open for, not just
#                                   the one it started in
#
# `region` is shared the same way: sales imports it from the geography bundle,
# the other two declare it natively, and all three call it `region`.
#
# The catalog is the intersection of the facts a *query* reads, not of all
# three. Ask for spend and revenue and you can group by `channel`, which both
# of those have; add a subscriptions measure to the same query and `channel` is
# refused, because there is no honest number to put in a subscriptions column
# on a row labelled "net ads".
#
# Measures are prefixed by fact alias (`sales.revenue`, `marketing.spend`)
# because two facts can easily both have a measure called `orders`.
name: commercial_overview
label: Commercial Overview
description: Marketing spend, sales revenue and active subscriptions on one timeline — three unrelated fact tables conformed on the shared calendar and region.

facts:
  - model: marketing
  - model: sales
  - model: subscriptions
    alias: subs
