# A model with three fact tables that have nothing to do with each other, read
# on one axis.
#
# Marketing spend, sales revenue and active subscriptions live in separate
# files with no key between them. Plotting all three on one timeline is the
# thing a single-table model cannot do — and joining the three together would
# be worse than not doing it at all, since every order would be paired with
# every spend row for its month and both measures would balloon.
#
# So this model doesn't join them. Each is a `datasets:` entry with no relation
# to the others, which makes it a fact table of its own, and the engine answers
# a query by running it separately against each one at the requested grain and
# merging the per-table *results* on the dimensions they share. Each measure
# keeps the grain of its own table.
#
# What conforms them is the `calendar` common model, imported once per fact
# table under `dimension_imports` — three separate relations to the same shared
# dimensions, which is what makes `calendar_date` mean one thing across all
# three. Note how differently each one reaches it, and how little that matters:
#
#   orders   on: order_date   — an event date, one row per order
#   spend    on: month        — already monthly, lands on each month start
#   subs     how: between     — an interval join, so a subscription counts
#                               in every period it was open for, not just
#                               the one it started in
#
# `region` is shared the plain way: all three declare a dimension called
# `region`, so all three can be grouped by it.
#
# The catalog is the intersection of the fact tables a *query* reads, not of
# all three. Ask for spend and revenue and you can group by `channel`, which
# both of those have; add a subscriptions measure to the same query and
# `channel` is refused, because there is no honest number to put in a
# subscriptions column on a row labelled "net ads".
name: commercial_overview
label: Commercial Overview
description: Marketing spend, sales revenue and active subscriptions on one timeline — three unrelated fact tables in one model, conformed on the shared calendar and on region.

datasets:
  - name: orders
    source:
      format: parquet
      path: s3://cash-intel/sales/*.parquet
    dimensions:
      - name: order_date
        label: Order Date
        type: time
      - name: channel
        label: Sales Channel
      - name: region
        label: Region
      - name: category
        label: Category
    measures:
      - name: revenue
        label: Revenue
        format: currency
        synonyms: [sales, turnover]
        expr: sum(unit_price * quantity)
      - name: orders
        label: Orders
        expr: count_distinct(order_id)

  - name: spend
    source:
      format: parquet
      path: s3://cash-intel/marketing/*.parquet
    dimensions:
      - name: month
        label: Month
        type: time
      - name: channel
        label: Ad Channel
      - name: region
        label: Region
    measures:
      - name: ad_spend
        label: Spend
        format: currency
        expr: sum(spend)
      - name: impressions
        label: Impressions
        expr: sum(impressions)

  - name: subs
    source:
      format: parquet
      path: s3://cash-intel/subscriptions/*.parquet
    dimensions:
      - name: plan
        label: Plan
      - name: region
        label: Region
    measures:
      - name: active_customers
        label: Active Customers
        description: Distinct customers active in each period.
        expr: count_distinct(customer_id)
      - name: mrr
        label: MRR
        format: currency
        expr: sum(monthly_fee)

dimension_imports:
  - bundle: calendar
    from_dataset: orders
    anchor_dataset: days
    left_on: order_date
    right_on: date
  - bundle: calendar
    from_dataset: spend
    anchor_dataset: days
    left_on: month
    right_on: date
  - bundle: calendar
    from_dataset: subs
    anchor_dataset: days
    how: between
    left_on: [start_date, end_date]
    right_on: date
