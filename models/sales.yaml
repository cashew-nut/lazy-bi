# Semantic model: sales order lines
# `source.path` is any glob DuckDB can scan from the object store.
# Measures are SQL: `expr:` holds an aggregate over this model's rows, and a
# measure that needs a step in between adds a `from:` block (see
# models/subscriptions.yaml). Every expression is parsed and allowlisted
# before it reaches a connection — see README, "The SQL measure grammar".
name: sales
label: Sales Orders
description: Order lines from the street markets, 2024 - mid 2026.
source:
  format: parquet
  path: s3://cash-intel/sales/*.parquet

# lookup tables joined into the base scan; their columns are then available
# to dimensions and measures like any base column
joins:
  - name: products
    source:
      format: csv
      path: s3://cash-intel/ref/products.csv
    on: product        # shorthand for left_on/right_on; how defaults to left

# region comes from the `geography` common dimensional model below (not
# declared here) — importing it gains map coordinates and a territory
# rollup for free, shared with every other model that imports the same bundle
dimension_imports:
  - bundle: geography
    anchor_dataset: regions
    on: region
  # the calendar bundle on the order date. Orders are already dated, so this
  # buys nothing for a sales-only report beyond the calendar's own attributes
  # (quarter labels, month-end flags) — its real job is conformance: it is what
  # lets `calendar_date` mean the same thing here as it does on any other model
  # that imports the same bundle, so the two can be read on one axis. See
  # models/commercial_overview.yaml.
  - bundle: calendar
    anchor_dataset: days
    left_on: order_date
    right_on: date

dimensions:
  - name: order_date
    column: order_date
    label: Order Date
    type: time
    synonyms: [date, purchase date]
  - name: channel
    label: Sales Channel
  - name: segment
    label: Customer Segment
  - name: category
    label: Category
  - name: product
    label: Product
  - name: supplier
    label: Supplier
    description: From the products.csv join.
  - name: tier
    label: Product Tier
    description: From the products.csv join.

measures:
  - name: revenue
    label: Revenue
    format: currency
    synonyms: [sales, turnover, income]
    expr: SUM(unit_price * quantity)
  - name: cost
    label: Cost
    format: currency
    expr: SUM(unit_cost * quantity)
  - name: profit
    label: Profit
    format: currency
    expr: SUM((unit_price - unit_cost) * quantity)
  - name: margin_pct
    label: Margin %
    format: percent
    description: Profit as a share of revenue.
    expr: SUM((unit_price - unit_cost) * quantity) / SUM(unit_price * quantity)
  - name: orders
    label: Orders
    expr: COUNT(DISTINCT order_id)
  - name: units
    label: Units Sold
    expr: SUM(quantity)
  - name: aov
    label: Avg Order Value
    format: currency
    synonyms: [average order value, basket size]
    expr: SUM(unit_price * quantity) / COUNT(DISTINCT order_id)
  - name: avg_unit_price
    label: Avg Unit Price
    format: currency
    expr: AVG(unit_price)
  - name: margin_per_unit
    label: Margin / Unit
    format: currency
    expr: SUM((unit_price - unit_cost) * quantity) / SUM(quantity)
  # window measures: a measure using a window function reads sibling
  # measures' already-aggregated values rather than raw columns. The engine
  # supplies `w` — PARTITION BY the query's other dimensions, ORDER BY its
  # time dimension — so query by order_date (any grain) to see these, and add
  # a breakout dimension (e.g. channel) to give each member its own running
  # total / prior-period comparison.
  - name: revenue_running_total
    label: Revenue (Running Total)
    format: currency
    description: Cumulative revenue over the query's date axis.
    expr: SUM(revenue) OVER w
  - name: revenue_pct_change
    label: Revenue % Change vs. Prior Period
    format: percent
    description: >-
      Change vs. the previous point on the query's date axis (e.g. previous
      quarter, if grouped by order_date at quarter grain).
    expr: (revenue - LAG(revenue) OVER w) / LAG(revenue) OVER w
