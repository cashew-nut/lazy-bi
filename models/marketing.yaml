# Semantic model: monthly marketing spend
name: marketing
label: Marketing Spend
description: Monthly ad spend and impressions by region and channel.
source:
  format: parquet
  path: s3://cash-intel/marketing/*.parquet

# this table is already monthly, and every `month` value is a month start, so
# it meets the calendar's day rows exactly once. Importing the bundle is what
# conforms it with the other models that import it — `calendar_date` here and
# `calendar_date` on sales are the same axis, which is what lets
# models/commercial_overview.yaml put spend and revenue on one chart.
dimension_imports:
  - bundle: calendar
    anchor_dataset: days
    left_on: month
    right_on: date

dimensions:
  - name: month
    label: Month
    type: time
  - name: region
    label: Region
    geo:              # coordinates for map visuals
      lat: region_lat
      lon: region_lon
  - name: channel
    label: Ad Channel

measures:
  - name: spend
    label: Spend
    format: currency
    expr: sum(spend)
  - name: impressions
    label: Impressions
    expr: sum(impressions)
  - name: cpm
    label: Cost per Mille
    format: currency
    description: Spend per thousand impressions.
    expr: sum(spend) / (sum(impressions) / 1000)
