# Generated by the Modelling workspace form. Editing this file by hand is
# fine — but a later save from the form rewrites it (comments included).
name: clinops_common_dimensions
label: Clinops Common Dimensions
description: Commonly Reused Dimensions
datasets:
- name: sites
  source:
    format: parquet
    path: s3://cash-intel/clinical-ops-synthetic/sites.parquet
  dimensions:
  - name: site_name
    label: Site Name
  - name: country
    label: Country
  - name: principal_investigator
    label: Principal Investigator
  - name: planned_activation_date
    label: Planned Activation Date
    type: time
  - name: actual_activation_date
    label: Actual Activation Date
    type: time
  - name: site_status
    label: Site Status
  joins:
  - to: studies
    on: study_id
- name: studies
  source:
    format: csv
    path: s3://cash-intel/clinical-ops-synthetic/studies.csv
  dimensions:
  - name: study_id
    label: Study Id
  - name: study_title
    label: Study Title
  - name: sponsor
    label: Sponsor
  - name: indication
    label: Indication
  - name: phase
    label: Phase
  - name: status
    label: Status
  - name: planned_start_date
    label: Planned Start Date
  - name: actual_start_date
    label: Actual Start Date
  - name: planned_primary_completion_date
    label: Planned Primary Completion Date
  - name: actual_primary_completion_date
    label: Actual Primary Completion Date
  - name: planned_study_completion_date
    label: Planned Study Completion Date
  - name: actual_study_completion_date
    label: Actual Study Completion Date
  - name: target_enrollment
    label: Target Enrollment
  - name: actual_enrollment
    label: Actual Enrollment
  - name: num_sites
    label: Num Sites
  - name: num_countries
    label: Num Countries
# Standalone date table: it declares no join to the datasets above on purpose.
# A model reaches it with an interval import — `how: between`, left_on the
# model's [start, end] columns, right_on `date` — which is what makes
# point-in-time ("active as of") aggregation work. The engine narrows this
# table to one row per bucket at whatever grain a query asks for, so totals
# hold up as the grain changes; `grain:` below says how far each column can be
# narrowed. Materialized by the `calendar` pipeline.
- name: calendar
  source:
    format: parquet
    path: s3://cash-intel/clinical-ops-synthetic/gold/calendar.parquet
  dimensions:
  - name: date
    label: Date
    type: time
    synonyms:
    - as of
    - as at
    - point in time
  - name: calendar_month
    column: month
    grain: 1mo
    label: Calendar Month
  - name: calendar_month_start
    column: month_start
    grain: 1mo
    label: Calendar Month Start
    type: time
  - name: calendar_quarter
    column: quarter
    grain: 1q
    label: Calendar Quarter
  - name: calendar_year
    column: year
    grain: 1y
    label: Calendar Year
    type: numeric
  # day-level flags: they describe a single day, so they read meaningfully at
  # day grain. For month-end reporting set `snapshot: end` on the import rather
  # than filtering these
  - name: calendar_is_month_start
    column: is_month_start
    label: Is Month Start
  - name: calendar_is_month_end
    column: is_month_end
    label: Is Month End
