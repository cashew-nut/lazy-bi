# Common dimensional model: a standalone date table.
#
# Nothing relates this bundle to any fact model by a shared key — that is the
# point. A model reaches it with an *interval* import:
#
#   dimension_imports:
#     - bundle: calendar
#       anchor_dataset: days
#       how: between
#       left_on: [start_date, end_date]   # the interval on the fact model
#       right_on: date                    # this table's day column
#
# which matches each fact row against every day it was open for. Grouping by
# any dimension below then aggregates point-in-time ("what was active as of
# this period") rather than by the date a row happened to start on. A null end
# column means still open. The calendar's own range bounds every such report.
#
# This is a DAILY table: a fact row lands in it once per day it was open. That
# is exactly right when grouping by calendar_date, and still right for a
# distinct count at a coarser grain ("active at any point in the quarter"), but
# an additive measure grouped by calendar_quarter/calendar_month_start sums
# once per day and inflates. Pin the calendar to one row per period first —
# filter calendar_is_month_start (period opened) or calendar_is_month_end (the
# usual month-end snapshot) — and additive measures read correctly.
name: calendar
label: Calendar
description: "Standalone date table for point-in-time reporting — import it with `how: between` against a start/end column pair."

datasets:
  - name: days
    source:
      format: parquet
      path: s3://cash-intel/ref/calendar.parquet
    dimensions:
      - name: calendar_date
        column: date
        label: Calendar Date
        type: time
        description: One row per day. Group by it (optionally at a coarser grain) for a point-in-time series.
        synonyms: [as of, as at, point in time, active date]
      - name: calendar_month
        column: month
        label: Calendar Month
        description: Sortable year-month label, e.g. "2026-01 Jan".
      - name: calendar_month_start
        column: month_start
        label: Calendar Month Start
        type: time
      - name: calendar_quarter
        column: quarter
        label: Calendar Quarter
        description: Year-qualified quarter, e.g. "2026-Q1".
      - name: calendar_year
        column: year
        label: Calendar Year
        type: numeric
      - name: calendar_week_start
        column: week_start
        label: Calendar Week Start
        type: time
      - name: calendar_day_of_week
        column: day_of_week
        label: Calendar Day Of Week
      - name: calendar_is_month_start
        column: is_month_start
        label: Is Month Start
        description: Filter to true for "as of the first of the month" snapshots.
      - name: calendar_is_month_end
        column: is_month_end
        label: Is Month End
        description: Filter to true for month-end snapshots — the usual reporting convention.
      - name: calendar_is_weekend
        column: is_weekend
        label: Is Weekend
