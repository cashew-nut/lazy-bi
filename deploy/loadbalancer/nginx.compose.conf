# The nginx.conf next to this one, pointed at docker-compose.scale.yml's two
# web replicas instead of placeholder hostnames. Same routing policy —
# consistent hashing on the model — so the local cluster exercises the real
# configuration rather than a simplified one.
#
# Everything below this header is identical to nginx.conf; read that file for
# why any of it is the way it is.
#
# Cache-affinity routing for the `web` replicas.
#
# This is an OPTIMIZATION, never a correctness requirement. The app is
# correct under plain round-robin — sessions are rows in the shared store and
# no replica holds anything another needs. What round-robin costs is cache
# warmth: a query's latency here is dominated by S3 round trips, and DuckDB's
# parquet-footer cache, external file cache and pinned lookup tables live on
# the replica that did the reading (docs/scaling.md §2).
#
# So the useful affinity key is not the *user* — it is the *model*, because
# that is what determines which sources get read. Two analysts querying the
# `sales` model should land on the same replica; one analyst querying `sales`
# and then `marketing` need not.
#
# Trade-off worth stating: this makes a hot model a hot replica. If one model
# carries most of your traffic, plain round-robin distributes CPU better and
# you should prefer it — scale vertically for cache warmth instead.

upstream cash_intel_web {
    # Consistent hashing: adding or removing a replica remaps ~1/N of the
    # keys rather than all of them, so a scale event costs one replica's
    # worth of cold cache instead of every replica's.
    hash $ci_cache_key consistent;

    server scale-web-1:8080 max_fails=3 fail_timeout=30s;
    server scale-web-2:8080 max_fails=3 fail_timeout=30s;

    keepalive 32;
}

# The model name, pulled from wherever this request carries it. Falls back to
# the remote address so a request with no model still gets a stable-ish
# replica rather than an empty hash key (which nginx would spread arbitrarily).
map $request_uri $ci_cache_key {
    # /api/models/<name>/..., /api/query?model=<name>, dashboards, visuals
    "~*[?&]model=(?<m>[a-zA-Z0-9_.-]+)"     $m;
    "~*/api/models/(?<m2>[a-zA-Z0-9_.-]+)"  $m2;
    default                                  $remote_addr;
}

server {
    listen 8090;
    server_name _;

    # Dataset uploads (POST /api/datasets/local) are multipart and can be
    # large; the default 1m rejects them with a 413 that surfaces in the UI
    # as an opaque JSON parse error.
    client_max_body_size 200m;

    location / {
        proxy_pass http://cash_intel_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat and the sandbox agent stream over Server-Sent Events. With
        # buffering on, nginx holds the whole stream and delivers it in one
        # block at the end — the feature still "works", it just stops looking
        # like streaming, which is a bug report nobody traces back to here.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;    # a cold scan against a slow endpoint
    }

    # POST bodies carry the model name for these, and nginx cannot hash on a
    # request body. They round-robin, which is fine: /api/query's own body
    # names the model, so if model affinity matters for your traffic mix,
    # have the frontend append ?model=<name> to the query URL (the backend
    # ignores unknown query parameters) and this map picks it up.
    location = /api/health {
        proxy_pass http://cash_intel_web;
        access_log off;
    }
}
