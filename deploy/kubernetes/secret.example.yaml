# Template only — placeholders, never real values. Copy it, fill it in, and
# keep your copy out of git; or drop it entirely in favour of External
# Secrets / SOPS / the platform's own secret store.
#
# On EKS with IRSA, the AWS keys can be omitted altogether: app/config.py
# falls through to boto3's credential chain, so the pod's service-account
# role is found without any of these being set.
apiVersion: v1
kind: Secret
metadata:
  name: cash-intel-secrets
type: Opaque
stringData:
  # Only needed without IRSA / an instance role.
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"

  # Conversational analytics, the Composer and the sandbox coding agent stay
  # off entirely until this is set (app/config.py's LLM_ENABLED). Leaving it
  # out is a valid, fully-functional deployment.
  CI_LLM_API_KEY: "REPLACE_ME"
