# TLS termination and routing. Two things worth noting, both of which are
# *absences*:
#
#  - No session affinity. Sessions are rows in the shared store, not
#    server-side memory, so any replica can serve any request. Affinity here
#    would only be a cache optimization — and a per-user one, which is the
#    wrong key; see deploy/loadbalancer/ for hashing on the model instead.
#  - No special handling for SSE. Chat streams over Server-Sent Events; the
#    proxy buffering annotation below is what keeps tokens flowing rather
#    than arriving in one block at the end.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cash-intel
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"        # SSE (chat)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"     # long queries
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"       # dataset uploads
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["bi.example.com"]
      secretName: cash-intel-tls
  rules:
    - host: bi.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cash-intel
                port: {name: http}
